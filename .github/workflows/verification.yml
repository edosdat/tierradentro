# Vérifie chaque modification avant la mise en ligne : lint, typage, modèle de contenu, construction, failles connues.
name: Vérification

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run sanity:valider
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
      # Failles connues dans le code servi aux visiteurs : bloquant au niveau « critique ».
      - run: npm audit --omit=dev --audit-level=critical
