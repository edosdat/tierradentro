# Mises à jour de sécurité automatiques : une proposition par semaine, regroupée.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    # Versions majeures bloquées tant que l'outillage ne les supporte pas (ESLint ne gère pas encore TypeScript 7).
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      sanity:
        patterns: ["sanity", "@sanity/*", "next-sanity"]
      next:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      autres:
        patterns: ["*"]
        exclude-patterns: ["sanity", "@sanity/*", "next-sanity", "next", "eslint-config-next", "react", "react-dom"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
